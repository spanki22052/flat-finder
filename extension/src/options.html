<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Flat Finder — настройки</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff8f5;
      color: #1e1b18;
      margin: 0;
      padding: 32px;
      min-width: 360px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }
    p.hint {
      font-size: 13px;
      color: #88726b;
      margin: 0 0 20px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #55433d;
      margin-bottom: 6px;
    }
    input[type="url"] {
      width: 100%;
      box-sizing: border-box;
      height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      border: 2px solid #dbc1b9;
      background: #ffffff;
      font-size: 14px;
      color: #1e1b18;
    }
    input[type="url"]:focus {
      outline: none;
      border-color: #964325;
      box-shadow: 0 0 0 3px rgba(150, 67, 37, 0.12);
    }
    button {
      margin-top: 16px;
      height: 40px;
      padding: 0 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #964325 0%, #b55b3b 100%);
      color: #fff8f5;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      transform: translateY(1px);
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #4f7a52;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>Flat Finder</h1>
  <p class="hint">
    Укажите адрес фронтенда Flat Finder. Расширение откроет
    <code>{адрес}/import</code> с данными объявления после нажатия на
    кнопку "+" на странице объявления.
  </p>
  <label for="frontendUrl">Адрес фронтенда</label>
  <input id="frontendUrl" type="url" placeholder="http://127.0.0.1:5173" />
  <button id="save">Сохранить</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
